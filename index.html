<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PolyPrep | GIET Study Portal</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0F172A">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#3B82F6',
            brandDark: '#1E3A8A',
            surface: '#0F172A'
          }
        }
      }
    }
  </script>

  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <!-- React & Babel CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .material-symbols-outlined { font-size: 24px; vertical-align: middle; }
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 transition-colors duration-200 text-gray-900 dark:text-gray-100">
  
  <div id="root"></div>

  <!-- 1. Load your Data File -->
  <script src="./data.js"></script>
  
  <!-- 2. Load your React App -->
  <script type="text/babel" src="./App.js"></script>

</body>
</html>
