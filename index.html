<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PolyPrep | GIET Study Portal</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2D2A54">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#2D2A54', // Dark purple from the drawer
          }
        }
      }
    }
  </script>

  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <!-- React & Babel CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .material-symbols-outlined { font-size: 24px; vertical-align: middle; }
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const data = {
      semesters: [
        { id: "1yr", name: "1st Year" },
        { id: "3", name: "3rd Sem" },
        { id: "4", name: "4th Sem" },
        { id: "5", name: "5th Sem" }
      ],
      branches: [
        { id: "cse", short: "CSE" },
        { id: "ece", short: "ECE" },
        { id: "mech", short: "MECH" },
        { id: "civil", short: "CIVIL" },
        { id: "eee", short: "EEE" }
      ],
      content: [
        // 5th Sem
        { id: 501, semester: "5", branchId: "cse", code: "CM-501", name: "Industrial Management & Entrepreneurship", pyqLink: "#", notesLink: "https://drive.google.com/your-link-here" },
        { id: 502, semester: "5", branchId: "cse", code: "CM-502", name: "Big Data & Cloud Computing", pyqLink: "#", notesLink: "https://drive.google.com/your-link-here" },
        { id: 503, semester: "5", branchId: "cse", code: "CM-503", name: "Android Programming", pyqLink: "#", notesLink: "#" },
        { id: 504, semester: "5", branchId: "cse", code: "CM-504", name: "Internet Of Things", pyqLink: "#", notesLink: "#" },
        { id: 505, semester: "5", branchId: "cse", code: "CM-505", name: "Python Programming", pyqLink: "#", notesLink: "https://drive.google.com/your-link-here" }
      ]
    };

    function App() {
      // States
      const [isLoggedIn, setIsLoggedIn] = useState(() => localStorage.getItem('poly_logged_in') === 'true');
      const [isDrawerOpen, setIsDrawerOpen] = useState(false);
      const [darkMode, setDarkMode] = useState(() => localStorage.getItem('poly_theme') === 'dark');
      const [activeBranch, setActiveBranch] = useState(() => localStorage.getItem('poly_branch') || 'cse');
      const [activeSem, setActiveSem] = useState(() => localStorage.getItem('poly_sem') || '5');
      const [pinnedSubjects, setPinnedSubjects] = useState(() => {
        const saved = localStorage.getItem('poly_pinned');
        return saved ? JSON.parse(saved) : [];
      });
      const [searchQuery, setSearchQuery] = useState('');
      const [view, setView] = useState('home'); 

      // Effects
      useEffect(() => {
        localStorage.setItem('poly_theme', darkMode ? 'dark' : 'light');
        if (darkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [darkMode]);

      useEffect(() => localStorage.setItem('poly_branch', activeBranch), [activeBranch]);
      useEffect(() => localStorage.setItem('poly_sem', activeSem), [activeSem]);
      useEffect(() => localStorage.setItem('poly_pinned', JSON.stringify(pinnedSubjects)), [pinnedSubjects]);
      useEffect(() => localStorage.setItem('poly_logged_in', isLoggedIn), [isLoggedIn]);

      const togglePin = (id) => {
        if (pinnedSubjects.includes(id)) {
          setPinnedSubjects(pinnedSubjects.filter(subId => subId !== id));
        } else {
          setPinnedSubjects([...pinnedSubjects, id]);
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        setIsLoggedIn(true);
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setIsDrawerOpen(false);
        setView('home');
      };

      const filteredSubjects = data.content.filter(sub => {
        const matchesBranch = sub.branchId === activeBranch;
        const matchesSem = sub.semester === activeSem;
        const matchesSearch = sub.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              sub.code.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesBranch && matchesSem && matchesSearch;
      });

      const pinnedList = data.content.filter(sub => pinnedSubjects.includes(sub.id));

      // Get current date string for the greeting card
      const dateOptions = { weekday: 'long', day: 'numeric', month: 'long' };
      const todayString = new Date().toLocaleDateString('en-US', dateOptions);

      // --- LOGIN SCREEN ---
      if (!isLoggedIn) {
        return (
          <div className="max-w-md mx-auto min-h-screen bg-white dark:bg-gray-900 flex flex-col justify-center p-6">
            <div className="text-center mb-10">
              <div className="w-20 h-20 mx-auto bg-brand text-white rounded-3xl flex items-center justify-center mb-6 shadow-lg">
                <span className="material-symbols-outlined" style={{fontSize: '40px'}}>menu_book</span>
              </div>
              <h1 className="text-3xl font-extrabold text-brand dark:text-white mb-2">PolyPrep</h1>
              <p className="text-gray-500 dark:text-gray-400 text-sm">GIET Polytechnic Study Portal</p>
            </div>
            
            <form onSubmit={handleLogin} className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1 ml-1">Student ID</label>
                <input type="text" placeholder="e.g. 24295-CM-012" className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand dark:text-white" required />
              </div>
              <div>
                <label className="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1 ml-1">Password</label>
                <input type="password" placeholder="••••••••" className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand dark:text-white" required />
              </div>
              <button type="submit" className="w-full bg-brand text-white font-bold py-3.5 rounded-xl mt-6 shadow-md shadow-brand/30 transition-transform active:scale-95">
                Secure Login
              </button>
            </form>
          </div>
        );
      }

      // --- MAIN APP SHELL ---
      return (
        <div className="max-w-md mx-auto min-h-screen bg-gray-50 dark:bg-gray-950 shadow-xl flex flex-col relative pb-20 overflow-x-hidden">
          
          {/* TOP HEADER */}
          <header className="bg-white dark:bg-gray-900 px-4 py-3 flex justify-between items-center shadow-sm z-30">
            <button onClick={() => setIsDrawerOpen(true)} className="p-2 -ml-2 text-gray-700 dark:text-gray-200">
              <span className="material-symbols-outlined">menu</span>
            </button>
            <div className="font-extrabold text-brand dark:text-white tracking-tight flex items-center gap-1">
               <span className="material-symbols-outlined text-brand dark:text-white" style={{fontSize: '20px'}}>school</span> PolyPrep
            </div>
            <button className="p-2 -mr-2 text-gray-700 dark:text-gray-200 relative">
              <span className="material-symbols-outlined">notifications</span>
              <span className="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border border-white dark:border-gray-900"></span>
            </button>
          </header>

          {/* SIDE DRAWER OVERLAY */}
          {isDrawerOpen && (
            <div className="fixed inset-0 z-50 flex max-w-md mx-auto">
              <div className="absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={() => setIsDrawerOpen(false)}></div>
              <div className="relative w-4/5 max-w-[300px] bg-brand h-full flex flex-col text-white shadow-2xl transition-transform transform translate-x-0">
                <div className="p-6 pt-10 border-b border-white/10">
                  <div className="w-16 h-16 bg-white text-brand rounded-2xl flex items-center justify-center text-3xl font-bold mb-4 shadow-inner">
                    A
                  </div>
                  <h2 className="font-bold text-sm leading-tight tracking-wide">AKULA VEERA VENKATA<br/>SIVA BHAVANI PRASAD</h2>
                  <p className="text-xs text-white/60 mt-1 font-mono">ID : 24295-CM-012</p>
                </div>
                
                <div className="flex-1 overflow-y-auto py-4 space-y-1">
                  <button onClick={() => { setDarkMode(!darkMode); setIsDrawerOpen(false); }} className="w-full flex items-center gap-4 px-6 py-3 text-sm font-medium hover:bg-white/10 transition-colors text-left">
                    <span className="material-symbols-outlined">{darkMode ? "light_mode" : "dark_mode"}</span> {darkMode ? "Light Mode" : "Dark Mode"}
                  </button>
                  <button className="w-full flex items-center gap-4 px-6 py-3 text-sm font-medium hover:bg-white/10 transition-colors text-left">
                    <span className="material-symbols-outlined">info</span> About PolyPrep
                  </button>
                  <button className="w-full flex items-center gap-4 px-6 py-3 text-sm font-medium hover:bg-white/10 transition-colors text-left">
                    <span className="material-symbols-outlined">share</span> Share App
                  </button>
                  <button className="w-full flex items-center gap-4 px-6 py-3 text-sm font-medium hover:bg-white/10 transition-colors text-left">
                    <span className="material-symbols-outlined">support_agent</span> Help desk
                  </button>
                </div>

                <div className="p-4 border-t border-white/10">
                  <button onClick={handleLogout} className="w-full flex items-center gap-4 px-2 py-3 text-sm font-medium text-red-300 hover:text-red-200 transition-colors text-left">
                    <span className="material-symbols-outlined">logout</span> Logout
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* --- HOME DASHBOARD --- */}
          {view === 'home' && (
            <div className="flex-1 p-4 overflow-y-auto scrollbar-hide space-y-6">
              
              {/* Greeting Card */}
              <div className="bg-white dark:bg-gray-900 rounded-2xl p-5 shadow-sm border border-gray-100 dark:border-gray-800">
                <h2 className="text-sm font-bold text-gray-900 dark:text-white leading-tight">
                  Hi Akula Veera Venkata Siva Bhavani Prasad,
                </h2>
                <p className="text-xs text-gray-500 dark:text-gray-400 mt-1">
                  Good Evening, {todayString}
                </p>
                <div className="mt-4 pt-3 border-t border-gray-100 dark:border-gray-800 flex justify-between items-center text-xs font-semibold text-brand dark:text-blue-400">
                  <span>View Exam Schedule</span>
                  <span className="material-symbols-outlined" style={{fontSize: '16px'}}>chevron_right</span>
                </div>
              </div>

              {/* Essentials Grid (Pastel Colors) */}
              <div>
                <h3 className="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-3 px-1">Study Essentials</h3>
                <div className="grid grid-cols-2 gap-3">
                  
                  {/* Notes Card - Pastel Green */}
                  <button onClick={() => { setView('notes'); window.scrollTo(0,0); }} className="bg-[#EAF5E5] dark:bg-green-900/20 rounded-2xl p-4 text-left transition-transform active:scale-95 shadow-sm">
                    <div className="w-8 h-8 bg-[#7DBA6C] text-white rounded-lg flex items-center justify-center mb-3">
                      <span className="material-symbols-outlined" style={{fontSize: '18px'}}>book</span>
                    </div>
                    <h4 className="font-bold text-gray-900 dark:text-gray-100 text-sm">Study Notes</h4>
                    <p className="text-[10px] text-gray-600 dark:text-gray-400 mt-1">Syllabus materials</p>
                  </button>

                  {/* Papers Card - Pastel Pink/Red */}
                  <button onClick={() => { setView('pyqs'); window.scrollTo(0,0); }} className="bg-[#FBECEF] dark:bg-red-900/20 rounded-2xl p-4 text-left transition-transform active:scale-95 shadow-sm">
                    <div className="w-8 h-8 bg-[#E9667C] text-white rounded-lg flex items-center justify-center mb-3">
                      <span className="material-symbols-outlined" style={{fontSize: '18px'}}>description</span>
                    </div>
                    <h4 className="font-bold text-gray-900 dark:text-gray-100 text-sm">Past Papers</h4>
                    <p className="text-[10px] text-gray-600 dark:text-gray-400 mt-1">Previous year Qs</p>
                  </button>

                  {/* Pinned Card - Pastel Purple */}
                  <button className="bg-[#EFEAF6] dark:bg-purple-900/20 rounded-2xl p-4 text-left transition-transform active:scale-95 shadow-sm">
                    <div className="w-8 h-8 bg-[#8363B5] text-white rounded-lg flex items-center justify-center mb-3">
                      <span className="material-symbols-outlined" style={{fontSize: '18px'}}>push_pin</span>
                    </div>
                    <h4 className="font-bold text-gray-900 dark:text-gray-100 text-sm">Quick Cram</h4>
                    <p className="text-[10px] text-gray-600 dark:text-gray-400 mt-1">{pinnedSubjects.length} Pinned Subjects</p>
                  </button>

                  {/* Syllabus Card - Pastel Blue */}
                  <button className="bg-[#E6F3F7] dark:bg-blue-900/20 rounded-2xl p-4 text-left transition-transform active:scale-95 shadow-sm">
                    <div className="w-8 h-8 bg-[#5AB5CB] text-white rounded-lg flex items-center justify-center mb-3">
                      <span className="material-symbols-outlined" style={{fontSize: '18px'}}>category</span>
                    </div>
                    <h4 className="font-bold text-gray-900 dark:text-gray-100 text-sm">All Branches</h4>
                    <p className="text-[10px] text-gray-600 dark:text-gray-400 mt-1">Explore curriculum</p>
                  </button>
                </div>
              </div>

              {/* Active Pins Section (Only shows if items are pinned) */}
              {pinnedList.length > 0 && (
                <div>
                  <h3 className="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-3 px-1 mt-2">Currently Studying</h3>
                  <div className="space-y-3">
                    {pinnedList.map(subject => (
                      <div key={`pin-${subject.id}`} className="p-4 rounded-2xl bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 shadow-sm relative">
                        <button onClick={() => togglePin(subject.id)} className="absolute top-3 right-3 text-brand dark:text-blue-400 p-1">
                           <span className="material-symbols-outlined text-[20px]" style={{fontVariationSettings: "'FILL' 1"}}>bookmark</span>
                        </button>
                        <div className="pr-8 mb-3">
                          <h3 className="font-bold text-gray-900 dark:text-white text-sm leading-tight">{subject.name}</h3>
                          <span className="text-[10px] font-mono text-gray-500 dark:text-gray-400 mt-1 block">{subject.code}</span>
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                          <a href={subject.notesLink} target="_blank" rel="noopener noreferrer" className="flex items-center justify-center gap-1 w-full bg-gray-50 dark:bg-gray-800 border border-gray-100 dark:border-gray-700 py-2 rounded-xl text-xs font-bold text-brand dark:text-blue-400">
                            Notes
                          </a>
                          <a href={subject.pyqLink} target="_blank" rel="noopener noreferrer" className="flex items-center justify-center gap-1 w-full bg-gray-50 dark:bg-gray-800 border border-gray-100 dark:border-gray-700 py-2 rounded-xl text-xs font-bold text-gray-700 dark:text-gray-300">
                            PYQs
                          </a>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}

          {/* --- DIRECTORY SCREEN (Notes or PYQs) --- */}
          {(view === 'notes' || view === 'pyqs') && (
            <div className="flex-1 flex flex-col h-full bg-white dark:bg-gray-950">
              
              <div className="px-4 py-2 border-b border-gray-100 dark:border-gray-800 bg-white dark:bg-gray-900 sticky top-0 z-20">
                <div className="flex justify-between items-center mb-3 mt-1">
                  <h1 className="text-lg font-bold text-gray-900 dark:text-white">
                    {view === 'notes' ? 'Study Notes' : 'Previous Papers'}
                  </h1>
                </div>

                <div className="relative mb-3">
                  <span className="material-symbols-outlined absolute left-3 top-2.5 text-gray-400" style={{fontSize: '20px'}}>search</span>
                  <input 
                    type="text" 
                    placeholder="Search by subject or code..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-900 dark:text-gray-100 rounded-xl py-2 pl-10 pr-4 text-sm focus:outline-none focus:ring-1 focus:ring-brand"
                  />
                </div>
                
                <div className="flex space-x-2 overflow-x-auto pb-2 scrollbar-hide">
                  {data.semesters.map(sem => (
                    <button
                      key={sem.id}
                      onClick={() => setActiveSem(sem.id)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap transition-colors ${
                        activeSem === sem.id ? 'bg-brand text-white' : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400'
                      }`}
                    >
                      {sem.name}
                    </button>
                  ))}
                </div>
              </div>

              <main className="flex-1 p-4 space-y-4 overflow-y-auto">
                <div className="flex space-x-2 overflow-x-auto pb-1 scrollbar-hide">
                  {data.branches.map(branch => (
                    <button
                      key={branch.id}
             onClick={() => { setActiveBranch(branch.id); setSearchQuery(''); }}
                      className={`px-4 py-1.5 rounded-full text-xs font-bold transition-colors whitespace-nowrap border ${
                        activeBranch === branch.id 
                          ? 'border-brand bg-brand/10 text-brand dark:border-blue-500 dark:bg-blue-900/30 dark:text-blue-400' 
                          : 'border-gray-200 dark:border-gray-700 bg-transparent text-gray-500'
                      }`}
                    >
                      {branch.short}
                    </button>
                  ))}
                </div>

                <div className="grid gap-3">
                  {filteredSubjects.length > 0 ? (
                    filteredSubjects.map(subject => {
                      const isPinned = pinnedSubjects.includes(subject.id);
                      return (
                        <div key={subject.id} className="p-4 rounded-2xl bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 shadow-sm flex flex-col relative">
                          <div className="flex justify-between items-start mb-3">
                            <div className="pr-6">
                              <h3 className="font-bold text-gray-900 dark:text-white text-sm">{subject.name}</h3>
                              <span className="text-[10px] font-mono text-gray-500 dark:text-gray-400 mt-1 block">
                                {subject.code}
                              </span>
                            </div>
                            <button onClick={() => togglePin(subject.id)} className={`absolute top-3 right-3 p-1 ${isPinned ? 'text-brand dark:text-blue-400' : 'text-gray-300 dark:text-gray-700'}`}>
                              <span className="material-symbols-outlined" style={{fontVariationSettings: isPinned ? "'FILL' 1" : "'FILL' 0", fontSize: '22px'}}>bookmark</span>
                            </button>
                          </div>
                          
                          {view === 'notes' ? (
                            <a href={subject.notesLink} target="_blank" rel="noopener noreferrer" className="flex items-center justify-center gap-2 w-full bg-[#EAF5E5] dark:bg-green-900/20 text-[#5D9A4C] dark:text-green-400 py-2.5 rounded-xl text-xs font-bold transition-colors active:scale-95">
                              <span className="material-symbols-outlined" style={{fontSize: '16px'}}>book</span> Access Notes
                            </a>
                          ) : (
                            <a href={subject.pyqLink} target="_blank" rel="noopener noreferrer" className="flex items-center justify-center gap-2 w-full bg-[#FBECEF] dark:bg-red-900/20 text-[#D94F67] dark:text-red-400 py-2.5 rounded-xl text-xs font-bold transition-colors active:scale-95">
                              <span className="material-symbols-outlined" style={{fontSize: '16px'}}>description</span> View PYQs
                            </a>
                          )}
                        </div>
                      );
                    })
                  ) : (
                    <div className="text-center py-10 text-gray-400 dark:text-gray-600 text-sm">
                      No materials found for this selection.
                    </div>
                  )}
                </div>
              </main>
            </div>
          )}

          {/* --- BOTTOM NAVIGATION --- */}
          <nav className="fixed bottom-0 w-full max-w-md mx-auto bg-white dark:bg-gray-900 border-t border-gray-100 dark:border-gray-800 flex justify-around items-center pb-safe z-40 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.05)] dark:shadow-none">
            <button onClick={() => { setView('home'); window.scrollTo(0,0); }} className={`flex flex-col items-center p-3 w-full transition-colors ${view === 'home' ? 'text-brand dark:text-blue-400' : 'text-gray-400 hover:text-gray-900 dark:hover:text-gray-200'}`}>
              <span className="material-symbols-outlined" style={{fontVariationSettings: view === 'home' ? "'FILL' 1" : "'FILL' 0"}}>{view === 'home' ? 'home' : 'home'}</span>
              <span className="text-[9px] font-bold mt-1">Home</span>
            </button>
            <button onClick={() => { setView('notes'); window.scrollTo(0,0); }} className={`flex flex-col items-center p-3 w-full transition-colors ${view === 'notes' ? 'text-brand dark:text-blue-400' : 'text-gray-400 hover:text-gray-900 dark:hover:text-gray-200'}`}>
              <span className="material-symbols-outlined" style={{fontVariationSettings: view === 'notes' ? "'FILL' 1" : "'FILL' 0"}}>import_contacts</span>
              <span className="text-[9px] font-bold mt-1">Notes</span>
            </button>
            <button onClick={() => { setView('pyqs'); window.scrollTo(0,0); }} className={`flex flex-col items-center p-3 w-full transition-colors ${view === 'pyqs' ? 'text-brand dark:text-blue-400' : 'text-gray-400 hover:text-gray-900 dark:hover:text-gray-200'}`}>
              <span className="material-symbols-outlined" style={{fontVariationSettings: view === 'pyqs' ? "'FILL' 1" : "'FILL' 0"}}>history_edu</span>
              <span className="text-[9px] font-bold mt-1">Papers</span>
            </button>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
