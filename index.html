<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PolyPrep | PYQs & Notes</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Mock Data Structure
    const data = {
      branches: [
        { id: "cse", short: "CSE" },
        { id: "ece", short: "ECE" },
        { id: "mech", short: "MECH" }
      ],
      content: [
        { id: 1, branchId: "cse", semester: 3, name: "Data Structures", code: "CM-303" },
        { id: 2, branchId: "cse", semester: 3, name: "DBMS", code: "CM-304" }
      ]
    };

    function App() {
      const [darkMode, setDarkMode] = useState(true);
      const [activeBranch, setActiveBranch] = useState('cse');

      // Toggle dark mode class on HTML body
      useEffect(() => {
        if (darkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [darkMode]);

      // Initialize icons after render
      useEffect(() => {
        lucide.createIcons();
      });

      const filteredSubjects = data.content.filter(sub => sub.branchId === activeBranch);

      return (
        <div className="max-w-md mx-auto min-h-screen bg-white dark:bg-gray-900 shadow-xl flex flex-col">
          {/* Header */}
          <header className="sticky top-0 z-10 bg-white dark:bg-gray-900 border-b dark:border-gray-800 p-4">
            <div className="flex justify-between items-center mb-4">
              <h1 className="text-xl font-bold text-blue-600 dark:text-blue-400 flex items-center gap-2">
                <i data-lucide="book-open"></i> PolyPrep
              </h1>
              <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300">
                <i data-lucide={darkMode ? "sun" : "moon"}></i>
              </button>
            </div>
          </header>

          {/* Content Area */}
          <main className="flex-1 p-4 space-y-6">
            {/* Branch Selector */}
            <div className="flex space-x-2 overflow-x-auto pb-2">
              {data.branches.map(branch => (
                <button
                  key={branch.id}
                  onClick={() => setActiveBranch(branch.id)}
                  className={`px-4 py-2 rounded-full text-sm font-medium ${
                    activeBranch === branch.id 
                      ? 'bg-blue-600 text-white' 
                      : 'bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300'
                  }`}
                >
                  {branch.short}
                </button>
              ))}
            </div>

            {/* Subject Cards */}
            <div className="grid gap-4">
              {filteredSubjects.map(subject => (
                <div key={subject.id} className="p-4 rounded-2xl border dark:border-gray-800 bg-white dark:bg-gray-800/50 shadow-sm">
                  <div className="flex justify-between items-start mb-2">
                    <h3 className="font-semibold text-gray-900 dark:text-white">{subject.name}</h3>
                    <span className="text-xs font-mono bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 px-2 py-1 rounded">
                      {subject.code}
                    </span>
                  </div>
                  <div className="grid grid-cols-2 gap-2 mt-4">
                    <button className="flex items-center justify-center gap-2 bg-gray-50 dark:bg-gray-700/50 py-2 rounded-lg text-sm text-gray-700 dark:text-gray-300">
                      <i data-lucide="file-text" className="w-4 h-4"></i> PYQs
                    </button>
                    <button className="flex items-center justify-center gap-2 bg-gray-50 dark:bg-gray-700/50 py-2 rounded-lg text-sm text-gray-700 dark:text-gray-300">
                      <i data-lucide="download" className="w-4 h-4"></i> Notes
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
